name: CI Pipeline

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Build and test the Teams app
  build-teams-app:
    name: Build & Test Teams App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EOC-TeamsFx/tabs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: EOC-TeamsFx/tabs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:coverage
        continue-on-error: true

      - name: Build application
        run: npm run build
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teams-app-build
          path: EOC-TeamsFx/tabs/build
          retention-days: 7

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: success()
        with:
          files: EOC-TeamsFx/tabs/coverage/coverage-final.json
          flags: teams-app
          name: teams-app-coverage
        continue-on-error: true

  # Build SharePoint extension
  build-spfx-extension:
    name: Build SharePoint Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EOC-Extensions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: EOC-Extensions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spfx-extension-build
          path: EOC-Extensions/dist
          retention-days: 7

  # Security scanning
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Audit Teams app dependencies
        working-directory: EOC-TeamsFx/tabs
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit SharePoint extension dependencies
        working-directory: EOC-Extensions
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EOC-TeamsFx/tabs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: EOC-TeamsFx/tabs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for console.log statements
        run: |
          echo "Checking for console.log statements in source code..."
          if grep -r "console\.log" src/ --exclude-dir=node_modules; then
            echo "❌ Found console.log statements. Please use the Logger utility instead."
            exit 1
          else
            echo "✅ No console.log statements found."
          fi
        continue-on-error: true

      - name: Check bundle size
        run: |
          npm run build
          BUNDLE_SIZE=$(du -sh build/static/js | cut -f1)
          echo "📦 Bundle size: $BUNDLE_SIZE"
